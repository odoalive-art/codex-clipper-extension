<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>小红书图文样例</title>
  </head>
  <body>
    <main class="note-container">
      <header class="top-title">
        <h1 class="title">周末把书桌重新布置了一遍</h1>
      </header>

      <section class="media-wrapper">
        <div class="swiper-slide swiper-slide-duplicate">
          <img
            src="https://ci.xiaohongshu.com/note-cover-2.jpg"
            alt="桌面细节"
            width="1080"
            height="1440"
          />
        </div>
        <div class="swiper-slide swiper-slide-visible swiper-slide-active" data-swiper-slide-index="0" data-index="0">
          <img
            data-xhs-img="https://ci.xiaohongshu.com/note-cover-1.jpg"
            alt="desk setup"
            width="1080"
            height="1440"
          />
        </div>
        <div class="swiper-slide" data-swiper-slide-index="1" data-index="1">
          <img
            src="https://ci.xiaohongshu.com/note-cover-2.jpg"
            alt="桌面细节"
            width="1080"
            height="1440"
          />
        </div>
      </section>

      <div class="author-card">
        <img src="https://ci.xiaohongshu.com/avatar.png" alt="author avatar" />
        <button>关注</button>
      </div>

      <div id="detail-desc" class="desc">
        <span>先把最常用的显示器抬高一点，肩颈压力会小很多。</span>
        <span>右手边加了一个</span><a href="/explore/desk-list">收纳清单</a><span>，桌面就不会再乱成一团。</span>
        <span>展开</span>
      </div>

      <div class="topics">#桌面改造 #HomeOffice</div>
      <section class="comment-container">
        <p>评论区内容不应该被抓取</p>
      </section>
      <section class="recommend-list">
        <p>相关推荐也不应该被抓取</p>
      </section>
    </main>
  </body>
</html>
