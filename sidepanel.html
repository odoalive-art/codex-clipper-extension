<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --ios-bg: linear-gradient(170deg, #eef3ff 0%, #f7f9ff 45%, #f3f4f7 100%);
      --card-bg: #ffffff;
      --primary: #131923;
      --accent: #1565d8;
      --accent-soft: #e7f0ff;
      --border: rgba(12, 26, 75, 0.1);
      --text-main: #1c1c1e;
      --text-sub: #8e8e93;
      --text-soft: #64748b;
      --ok: #2e7d32;
      --warn: #b45309;
      --err: #dc2626;
    }

    body {
      height: 100vh;
      margin: 0;
      padding: 4px;
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .container {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(21, 34, 78, 0.16);
      border: 1px solid var(--border);
    }

    .header {
      padding: 12px 12px 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      z-index: 10;
      border-bottom: 0.5px solid var(--border);
    }

    .site-badges {
      display: flex;
      gap: 6px;
      padding-bottom: 8px;
      flex-wrap: wrap;
      max-height: 44px;
      overflow-y: auto;
    }
    .site-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 100px;
      background: #f5f8ff;
      color: var(--text-soft);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      max-width: 124px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 1;
    }
    .site-badge::before {
      content: '';
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c7c7cc;
    }
    .site-badge.active {
      background: #e9f8ee;
      color: var(--ok);
      border-color: rgba(46, 125, 50, 0.2);
    }
    .site-badge.active::before { background: #34c759; }
    .meta {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .chip {
      font-size: 11px;
      line-height: 1;
      padding: 5px 9px;
      border-radius: 100px;
      border: 1px solid #e4e9f5;
      color: var(--text-soft);
      background: #f8fafe;
      white-space: nowrap;
    }
    .chip.status-running {
      color: var(--accent);
      border-color: rgba(21, 101, 216, 0.25);
      background: var(--accent-soft);
    }
    .chip.status-ok {
      color: var(--ok);
      border-color: rgba(46, 125, 50, 0.25);
      background: #ecf9f0;
    }
    .chip.status-warn {
      color: var(--warn);
      border-color: rgba(180, 83, 9, 0.2);
      background: #fff6ea;
    }
    .chip.status-error {
      color: var(--err);
      border-color: rgba(220, 38, 38, 0.2);
      background: #feefef;
    }

    #preview {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      overflow-x: hidden;
      outline: none;
      font-size: 14px;
      line-height: 1.65;
      color: #3a3a3c;
      scrollbar-width: thin;
      scrollbar-color: #d7deeb transparent;
    }
    #preview::-webkit-scrollbar { width: 8px; }
    #preview::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #d7deeb;
    }
    #preview:empty::before {
      content: "点击下方按钮净化内容...";
      color: #c7c7cc;
      text-align: left;
      display: block;
    }
    #preview h1 { font-size: 19px; font-weight: 700; margin: 0 0 12px; color: #000; }
    #preview h2 { font-size: 16px; font-weight: 700; margin: 0 0 10px; color: #000; }
    #preview h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #1c1c1e; }
    #preview p { margin: 0 0 12px; }
    #preview img {
      max-width: 100%;
      border-radius: 0px;
      margin: 6px 0;
      display: block;
      border: 0.5px solid var(--border);
    }
    .preview-image-card {
      margin: 10px 0 14px;
      position: relative;
    }
    .copy-image-btn {
      margin-top: 0;
      border: 1px solid rgba(17, 24, 39, 0.15);
      background: rgba(255, 255, 255, 0.9);
      color: #2f3747;
      border-radius: 4px;
      font-size: 11px;
      padding: 5px 8px;
      cursor: pointer;
      position: absolute;
      right: 8px;
      bottom: 8px;
      backdrop-filter: blur(6px);
    }
    .copy-image-btn:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .msg { text-align: center; margin-top: 80px; font-size: 13px; color: #8e8e93; }
    .msg.warn { color: #ff9500; }
    .msg.error { color: #ff3b30; }

    .tools {
      border-top: 0.5px solid var(--border);
      background: rgba(248, 250, 255, 0.72);
      padding: 8px 12px;
      display: grid;
      gap: 8px;
    }
    details {
      border: 1px solid #e6e9f2;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 10px;
    }
    summary {
      cursor: pointer;
      font-size: 12px;
      color: #3a3a3c;
      font-weight: 600;
    }
    .tool-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: #3a3a3c;
    }
    .tool-row label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }
    .tool-row input[type="checkbox"] {
      margin: 0;
    }
    .mini-btn {
      border: 1px solid #d8d8de;
      background: #fff;
      color: #3a3a3c;
      border-radius: 4px;
      font-size: 11px;
      padding: 5px 8px;
      cursor: pointer;
    }
    #rulesInput {
      width: 100%;
      min-height: 120px;
      max-height: 240px;
      border: 1px solid #e5e5ec;
      border-radius: 4px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
      margin-top: 8px;
    }
    #debugOutput {
      margin-top: 8px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      max-height: 100px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #3a3a3c;
    }

    .footer {
      padding: 12px 12px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 0.5px solid var(--border);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }
    .footer.has-results {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    }
    .btn {
      padding: 12px 14px;
      max-height: 40px;
      border-radius: 100px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-text { line-height: 1; }
    .icon {
      width: 17px;
      height: 17px;
      min-width: 17px;
      min-height: 17px;
      max-width: 17px;
      max-height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
      align-self: center;
      margin: 0;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary {
      background: #1d4ed8;
      color: #fff;
      display: none;
    }
    .btn-icon {
      width: 40px;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid #d7e1f7;
      background: #eef3ff;
      color: #1e3a8a;
      display: none;
      position: relative;
    }
    .btn-icon::after {
      content: attr(data-tooltip);
      position: absolute;
      right: 46px;
      top: 50%;
      transform: translateY(-50%);
      background: #111827;
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .btn-icon:hover::after,
    .btn-icon:focus-visible::after {
      opacity: 1;
    }
    .btn-icon .btn-text {
      display: none;
    }
    .footer.has-results .btn-secondary,
    .footer.has-results .btn-icon {
      display: flex;
    }
    .btn:disabled {
      cursor: default;
      opacity: 0.7;
    }
    .btn:active { transform: scale(0.96); opacity: 0.8; }
    .debug-fab {
      position: absolute;
      right: 12px;
      bottom: 72px;
      z-index: 20;
      border: none;
      border-radius: 999px;
      background: rgba(19, 25, 35, 0.94);
      color: #fff;
      padding: 10px 14px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 14px 24px rgba(19, 25, 35, 0.28);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }
    .debug-fab:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 28px rgba(19, 25, 35, 0.34);
    }
    .debug-fab:active {
      transform: translateY(0);
    }
    .debug-fab .icon {
      width: 15px;
      height: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div id="siteBadges" class="site-badges"></div>
      <div class="meta">
        <span id="statusChip" class="chip">状态：就绪</span>
        <span id="countChip" class="chip">块数：0</span>
      </div>
    </div>

    <div id="preview" spellcheck="false"></div>

    <div class="tools">
      <details>
        <summary>规则配置（JSON）</summary>
        <textarea id="rulesInput"></textarea>
        <div class="tool-row">
          <button id="saveRulesBtn" class="mini-btn">保存规则</button>
          <button id="resetRulesBtn" class="mini-btn">恢复默认</button>
          <button id="copyRulesBtn" class="mini-btn">复制JSON</button>
        </div>
      </details>
      <details>
        <summary>调试信息</summary>
        <div class="tool-row">
          <label><input id="debugModeCheckbox" type="checkbox" checked> 启用调试</label>
        </div>
        <pre id="debugOutput"></pre>
      </details>
    </div>

    <div class="footer">
      <button id="grabBtn" class="btn btn-primary">
        <span class="btn-text">开始净化</span>
      </button>
      <button id="copyBtn" class="btn btn-secondary">
        <span class="btn-text">复制 Markdown</span>
      </button>
      <button id="exportNotionBtn" class="btn btn-icon" aria-label="导出 Notion 包" data-tooltip="导出 Notion 包">
        <span class="btn-text">导出 Notion 包</span>
      </button>
    </div>
    <button id="debugMockBtn" class="debug-fab" type="button">
      <span>调试模式</span>
    </button>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
