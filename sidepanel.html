<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --ios-bg: linear-gradient(170deg, #eef3ff 0%, #f7f9ff 45%, #f3f4f7 100%);
      --card-bg: #ffffff;
      --primary: #131923;
      --accent: #1565d8;
      --accent-soft: #e7f0ff;
      --border: rgba(12, 26, 75, 0.1);
      --text-main: #1c1c1e;
      --text-sub: #8e8e93;
      --text-soft: #64748b;
      --ok: #2e7d32;
      --warn: #b45309;
      --err: #dc2626;
    }

    body {
      height: 100vh;
      margin: 0;
      padding: 4px;
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .container {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(21, 34, 78, 0.16);
      border: 1px solid var(--border);
    }

    .header {
      padding: 12px 12px 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      z-index: 10;
      border-bottom: 0.5px solid var(--border);
    }

    .site-badges {
      display: flex;
      gap: 6px;
      padding-bottom: 8px;
      flex-wrap: wrap;
      max-height: 44px;
      overflow-y: auto;
    }
    .site-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 100px;
      background: #f5f8ff;
      color: var(--text-soft);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      max-width: 124px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 1;
    }
    .site-badge::before {
      content: '';
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c7c7cc;
    }
    .site-badge.active {
      background: #e9f8ee;
      color: var(--ok);
      border-color: rgba(46, 125, 50, 0.2);
    }
    .site-badge.active::before { background: #34c759; }
    .meta {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .meta-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .settings-link {
      border: 1px solid #d8d8de;
      background: #fff;
      color: #1f2937;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .settings-link:hover {
      border-color: #c8d3ec;
      background: #f8fbff;
    }
    .chip {
      font-size: 11px;
      line-height: 1;
      padding: 5px 9px;
      border-radius: 100px;
      border: 1px solid #e4e9f5;
      color: var(--text-soft);
      background: #f8fafe;
      white-space: nowrap;
    }
    .chip.status-running {
      color: var(--accent);
      border-color: rgba(21, 101, 216, 0.25);
      background: var(--accent-soft);
    }
    .chip.status-ok {
      color: var(--ok);
      border-color: rgba(46, 125, 50, 0.25);
      background: #ecf9f0;
    }
    .chip.status-warn {
      color: var(--warn);
      border-color: rgba(180, 83, 9, 0.2);
      background: #fff6ea;
    }
    .chip.status-error {
      color: var(--err);
      border-color: rgba(220, 38, 38, 0.2);
      background: #feefef;
    }

    #preview {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      overflow-x: hidden;
      outline: none;
      font-size: 14px;
      line-height: 1.65;
      color: #3a3a3c;
      scrollbar-width: thin;
      scrollbar-color: #d7deeb transparent;
    }
    #preview::-webkit-scrollbar { width: 8px; }
    #preview::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #d7deeb;
    }
    #preview:empty::before {
      content: "点击下方按钮净化内容...";
      color: #c7c7cc;
      text-align: left;
      display: block;
    }
    #preview h1 { font-size: 19px; font-weight: 700; margin: 0 0 12px; color: #000; }
    #preview h2 { font-size: 16px; font-weight: 700; margin: 0 0 10px; color: #000; }
    #preview h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #1c1c1e; }
    #preview p { margin: 0 0 12px; }
    #preview a {
      color: #1d4ed8;
      text-decoration: underline;
      text-decoration-color: rgba(29, 78, 216, 0.35);
      text-underline-offset: 2px;
    }
    .preview-code-card {
      position: relative;
      margin: 10px 0 14px;
    }
    .preview-code-lang {
      position: absolute;
      right: 8px;
      top: 8px;
      font-size: 10px;
      line-height: 1;
      color: #64748b;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      padding: 4px 7px;
      text-transform: lowercase;
    }
    .preview-code {
      margin: 0;
      padding: 14px 12px 12px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, 0.14);
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
      overflow-x: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.6;
      tab-size: 2;
      box-sizing: border-box;
    }
    .preview-code code {
      font: inherit;
      color: inherit;
      white-space: inherit;
    }
    #preview img {
      max-width: 100%;
      border-radius: 0px;
      margin: 6px 0;
      display: block;
      border: 0.5px solid var(--border);
    }
    .preview-image-card {
      margin: 10px 0 14px;
      position: relative;
    }
    .copy-image-btn {
      margin-top: 0;
      border: 1px solid rgba(17, 24, 39, 0.15);
      background: rgba(255, 255, 255, 0.9);
      color: #2f3747;
      border-radius: 4px;
      font-size: 11px;
      padding: 5px 8px;
      cursor: pointer;
      position: absolute;
      right: 8px;
      bottom: 8px;
      backdrop-filter: blur(6px);
    }
    .copy-link-btn {
      margin-top: 0;
      border: 1px solid rgba(17, 24, 39, 0.15);
      background: rgba(255, 255, 255, 0.9);
      color: #2f3747;
      border-radius: 4px;
      font-size: 11px;
      padding: 5px 8px;
      cursor: pointer;
      position: absolute;
      left: 8px;
      bottom: 8px;
      backdrop-filter: blur(6px);
    }
    .copy-image-btn:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .copy-link-btn:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .msg { text-align: center; margin-top: 80px; font-size: 13px; color: #8e8e93; }
    .msg.warn { color: #ff9500; }
    .msg.error { color: #ff3b30; }

    .footer {
      padding: 12px 12px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 0.5px solid var(--border);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }
    .footer.has-results {
      grid-template-columns: auto auto auto auto minmax(0, 1fr);
      align-items: center;
    }
    .btn {
      padding: 12px 14px;
      max-height: 40px;
      border-radius: 100px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-text { line-height: 1; }
    .icon {
      width: 17px;
      height: 17px;
      min-width: 17px;
      min-height: 17px;
      max-width: 17px;
      max-height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
      align-self: center;
      margin: 0;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary {
      background: #1d4ed8;
      color: #fff;
      display: none;
    }
    .btn-send-main {
      display: none;
      background: var(--primary);
      color: #fff;
      justify-self: stretch;
      width: 100%;
    }
    .btn-icon {
      width: 40px;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid #d7e1f7;
      background: #eef3ff;
      color: #1e3a8a;
      display: none;
      position: relative;
    }
    .footer.has-results #grabBtn,
    .footer.has-results #copyBtn,
    .footer.has-results #exportNotionBtn,
    .footer.has-results #clipToObsidianBtn {
      width: 40px;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid #d7e1f7;
      background: #eef3ff;
      color: #1e3a8a;
      position: relative;
    }
    .footer.has-results #grabBtn .btn-text,
    .footer.has-results #copyBtn .btn-text,
    .footer.has-results #exportNotionBtn .btn-text,
    .footer.has-results #clipToObsidianBtn .btn-text {
      display: none;
    }
    .footer.has-results #grabBtn::after,
    .footer.has-results #copyBtn::after,
    .footer.has-results #exportNotionBtn::after,
    .footer.has-results #clipToObsidianBtn::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .footer.has-results #grabBtn:hover::after,
    .footer.has-results #copyBtn:hover::after,
    .footer.has-results #exportNotionBtn:hover::after,
    .footer.has-results #clipToObsidianBtn:hover::after,
    .footer.has-results #grabBtn:focus-visible::after,
    .footer.has-results #copyBtn:focus-visible::after,
    .footer.has-results #exportNotionBtn:focus-visible::after,
    .footer.has-results #clipToObsidianBtn:focus-visible::after {
      opacity: 1;
    }
    .btn-icon .btn-text {
      display: none;
    }
    .footer.has-results .btn-secondary,
    .footer.has-results .btn-icon,
    .footer.has-results .btn-send-main {
      display: flex;
    }
    .btn:disabled {
      cursor: default;
      opacity: 0.7;
    }
    .btn:active { transform: scale(0.96); opacity: 0.8; }

    .obsidian-toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 72px;
      z-index: 40;
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .obsidian-toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .obsidian-toast.warn {
      border-color: rgba(180, 83, 9, 0.18);
      background: #fff9f0;
    }
    .obsidian-toast.error {
      border-color: rgba(220, 38, 38, 0.18);
      background: #fff5f5;
    }
    .obsidian-toast-title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }
    .obsidian-toast-detail {
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .obsidian-toast-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .obsidian-toast-btn {
      border: 1px solid rgba(29, 78, 216, 0.16);
      background: #fff;
      color: #1d4ed8;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div id="siteBadges" class="site-badges"></div>
      <div class="meta">
        <span id="statusChip" class="chip">状态：就绪</span>
        <div class="meta-right">
          <span id="countChip" class="chip">块数：0</span>
          <button id="openSettingsBtn" class="settings-link" type="button">设置</button>
        </div>
      </div>
    </div>

    <div id="preview" spellcheck="false"></div>

    <div class="footer">
      <button id="grabBtn" class="btn btn-primary" aria-label="重新抓取" data-tooltip="重新抓取">
        <span class="btn-text">开始净化</span>
      </button>
      <button id="copyBtn" class="btn btn-secondary" aria-label="复制 Markdown" data-tooltip="复制 Markdown">
        <span class="btn-text">复制 Markdown</span>
      </button>
      <button id="exportNotionBtn" class="btn btn-icon" aria-label="导出 Notion 包" data-tooltip="导出 Notion 包">
        <span class="btn-text">导出 Notion 包</span>
      </button>
      <button id="clipToObsidianBtn" class="btn btn-icon" aria-label="发送到 Obsidian" data-tooltip="发送到 Obsidian">
        <span class="btn-text">发送到 Obsidian</span>
      </button>
      <button id="clipToNotionBtn" class="btn btn-send-main" aria-label="发送到 Notion">
        <span class="btn-text">发送到 Notion</span>
      </button>
    </div>
  </div>
  <div id="obsidianToast" class="obsidian-toast" aria-live="polite" role="status">
    <div id="obsidianToastTitle" class="obsidian-toast-title"></div>
    <div id="obsidianToastDetail" class="obsidian-toast-detail"></div>
    <div class="obsidian-toast-actions">
      <button id="obsidianToastAction" class="obsidian-toast-btn" type="button" hidden></button>
      <button id="obsidianToastDismiss" class="obsidian-toast-btn" type="button">知道了</button>
    </div>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
